<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Mãos que Cuidam | ONG de Cursos de Banho e Tosa & Proteção Animal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ONG Mãos que Cuidam: Capacitação social e profissional gratuita em Banho e Tosa de Animais. Amor, Respeito e Proteção para quem transforma vidas e cuida dos nossos pets.">
  <meta name="theme-color" content="#132a47">
  
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  
  <!-- Google Fonts: Poppins & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Desativar e ocultar drawer/badge injetado pelo Netlify -->
  <style>
    netl-drawer,
    netlify-drawer,
    #netlify-drawer,
    .netlify-badge,
    [data-netlify-deploy-id],
    [class*="netlify-drawer"],
    [class*="feedback-widget"],
    iframe[title*="Netlify" i],
    iframe[src*="netlify" i],
    div[id*="netlify" i]:not(#root):not(#app),
    div[class*="netlify" i],
    div[style*="z-index: 2147483647"],
    div[style*="z-index: 1000000"],
    a[href*="netlify.com"][style*="position: fixed"],
    a[href*="netlify.com"][style*="position: absolute"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      max-width: 0 !important;
      max-height: 0 !important;
      overflow: hidden !important;
      position: absolute !important;
      left: -9999px !important;
      top: -9999px !important;
      z-index: -9999 !important;
    }
  </style>
</head>
<body>
  <app-root></app-root>
  <script>
    (function() {
      function removeNetlifyBadge() {
        var badges = document.querySelectorAll('netl-drawer, netlify-drawer, #netlify-drawer, [data-netlify-deploy-id], [class*="netlify-drawer"], [class*="feedback-widget"], iframe[title*="Netlify" i]');
        badges.forEach(function(el) { el.remove(); });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', removeNetlifyBadge);
      } else {
        removeNetlifyBadge();
      }
      if (window.MutationObserver) {
        var observer = new MutationObserver(function() {
          removeNetlifyBadge();
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      }
    })();
  </script>
</body>
</html>
